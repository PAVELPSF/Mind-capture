<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindCapture — Дорожная карта</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f0f13;
    --surface: #16161d;
    --surface2: #1e1e28;
    --border: #2a2a38;
    --border2: #3a3a50;
    --text: #e8e8f0;
    --muted: #7070a0;
    --accent: #7c6af7;
    --accent2: #a594f9;
    --todo: #2a2a38;
    --todo-t: #7070a0;
    --inprogress: #1a1a2e;
    --inprogress-b: #7c6af7;
    --inprogress-t: #a594f9;
    --done: #0d1a14;
    --done-b: #22c55e;
    --done-t: #4ade80;
    --blocked: #1f1010;
    --blocked-b: #ef4444;
    --blocked-t: #f87171;
    --yellow: #ca8a04;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    padding: 2rem 2.5rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #7c6af7, #a594f9);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .header-sub { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  /* STATS BAR */
  .stats-bar {
    display: flex; gap: 24px; padding: 1rem 2.5rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat { display: flex; align-items: center; gap: 8px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-num { font-size: 14px; font-weight: 600; }

  /* PROGRESS BAR */
  .progress-wrap { padding: 1rem 2.5rem; border-bottom: 1px solid var(--border); }
  .progress-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #7c6af7, #a594f9); transition: width 0.5s ease; border-radius: 2px; }

  /* KANBAN BOARD */
  .board-scroll { overflow-x: auto; padding: 1.5rem 2.5rem 2rem; }
  .board { display: grid; grid-template-columns: repeat(4, 280px); gap: 16px; min-width: max-content; }

  .column { display: flex; flex-direction: column; gap: 0; }
  .column-header {
    padding: 10px 14px;
    border-radius: 8px 8px 0 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--surface2);
    display: flex; align-items: center; gap: 8px;
  }
  .col-count {
    background: var(--border2);
    color: var(--muted);
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 10px;
    margin-left: auto;
  }
  .cards-wrap {
    border: 1px solid var(--border);
    border-radius: 0 0 8px 8px;
    background: var(--surface);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 100px;
  }

  /* SPRINT CARD */
  .sprint-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .sprint-card:hover { border-color: var(--border2); }
  .sprint-card.status-inprogress { border-left: 3px solid var(--accent); }
  .sprint-card.status-done { border-left: 3px solid var(--green); }
  .sprint-card.status-blocked { border-left: 3px solid var(--red); }

  .card-top { padding: 12px 12px 10px; }
  .card-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .sprint-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: var(--border);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .status-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: auto;
  }
  .badge-todo { background: var(--todo); color: var(--todo-t); }
  .badge-inprogress { background: var(--inprogress); color: var(--inprogress-t); border: 1px solid rgba(124,106,247,0.3); }
  .badge-done { background: var(--done); color: var(--done-t); border: 1px solid rgba(34,197,94,0.3); }
  .badge-blocked { background: var(--blocked); color: var(--blocked-t); border: 1px solid rgba(239,68,68,0.3); }

  .card-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .card-desc { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

  /* TASKS */
  .tasks-wrap { padding: 0 12px 6px; }
  .task-item {
    display: flex; align-items: flex-start; gap: 7px;
    padding: 4px 0;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .task-item:first-child { border-top: none; }
  .task-check {
    width: 13px; height: 13px;
    border: 1.5px solid var(--border2);
    border-radius: 3px;
    margin-top: 1px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
  }
  .task-check.done { background: var(--green); border-color: var(--green); color: #000; }
  .task-text { flex: 1; }
  .task-text.done { text-decoration: line-through; color: #3a3a50; }

  /* QA SECTION */
  .qa-wrap {
    padding: 8px 12px 10px;
    background: rgba(124,106,247,0.04);
    border-top: 1px solid var(--border);
  }
  .qa-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .qa-item {
    display: flex; align-items: flex-start; gap: 7px;
    padding: 3px 0;
    font-size: 11px;
    color: var(--muted);
  }
  .qa-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border2); margin-top: 5px; flex-shrink: 0; }
  .qa-dot.ok { background: var(--green); }
  .qa-dot.fail { background: var(--red); }
  .qa-dot.warn { background: var(--yellow); }
  .bug-tag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(239,68,68,0.15);
    color: var(--red);
    margin-left: auto;
    white-space: nowrap;
  }

  /* CARD FOOTER */
  .card-footer {
    padding: 7px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .completed-at { color: var(--green); font-size: 10px; }

  /* HISTORY SECTION */
  .history-section {
    padding: 1.5rem 2.5rem 2rem;
    border-top: 1px solid var(--border);
  }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }
  .history-timeline { position: relative; padding-left: 20px; }
  .history-timeline::before {
    content: '';
    position: absolute;
    left: 6px; top: 0; bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .history-item { position: relative; padding: 0 0 16px 20px; }
  .history-item::before {
    content: '';
    position: absolute;
    left: -14px; top: 6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }
  .history-date { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .history-text { font-size: 12px; color: var(--text); margin-top: 2px; }
  .history-empty { font-size: 12px; color: var(--muted); font-style: italic; }

  /* BUTTON */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Manrope', sans-serif;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--border); border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }

  /* VERSIONS */
  .versions-bar {
    padding: 1rem 2.5rem;
    border-top: 1px solid var(--border);
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .v-tag {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .v-tag.active { border-color: var(--accent); color: var(--accent2); background: rgba(124,106,247,0.08); }
  .v-label { font-size: 11px; color: var(--muted); margin-right: 4px; }

  @media print {
    body { background: #fff; color: #000; }
    .btn { display: none; }
  }
</style>
</head>

// ─── РЕНДЕР ───────────────────────────────────────────────────────

const STATUS_LABELS = {
  todo: "To Do",
  inprogress: "In Progress",
  done: "Done",
  blocked: "Blocked"
};

const COLUMNS = ["todo", "inprogress", "done", "blocked"];
const COL_TITLES = {
  todo: "📋 Запланировано",
  inprogress: "⚡ В работе",
  done: "✅ Готово",
  blocked: "🚫 Заблокировано"
};

function renderQAStatus(s) {
  if (s === "ok") return "ok";
  if (s === "fail") return "fail";
  if (s === "warn") return "warn";
  return "";
}

function renderCard(sprint) {
  const doneTasks = sprint.tasks.filter(t => t.done).length;
  const totalTasks = sprint.tasks.length;
  const doneQA = sprint.qa.filter(q => q.status === "ok").length;
  const failQA = sprint.qa.filter(q => q.status === "fail").length;

  const tasksHtml = sprint.tasks.map(t => `
    <div class="task-item">
      <div class="task-check ${t.done ? 'done' : ''}">
        ${t.done ? '✓' : ''}
      </div>
      <span class="task-text ${t.done ? 'done' : ''}">${t.text}</span>
    </div>
  `).join('');

  const qaHtml = sprint.qa.map(q => `
    <div class="qa-item">
      <div class="qa-dot ${renderQAStatus(q.status)}"></div>
      <span style="flex:1">${q.text}</span>
      ${q.status === 'fail' ? '<span class="bug-tag">BUG</span>' : ''}
    </div>
  `).join('');

  const completedHtml = sprint.completedAt
    ? `<span class="completed-at">✓ ${sprint.completedAt}</span>`
    : `<span>${doneTasks}/${totalTasks} задач</span>`;

  return `
    <div class="sprint-card status-${sprint.status}">
      <div class="card-top">
        <div class="card-meta">
          <span class="sprint-num">${sprint.id}</span>
          <span class="status-badge badge-${sprint.status}">${STATUS_LABELS[sprint.status]}</span>
        </div>
        <div class="card-title">${sprint.title}</div>
        <div class="card-desc">${sprint.desc}</div>
      </div>
      <div class="tasks-wrap">${tasksHtml}</div>
      <div class="qa-wrap">
        <div class="qa-title">
          <span>QA верификация</span>
          <span style="margin-left:auto;color:${failQA>0?'var(--red)':doneQA===sprint.qa.length?'var(--green)':'var(--muted)'};font-size:10px">
            ${failQA > 0 ? failQA + ' баг(а)' : doneQA + '/' + sprint.qa.length + ' ок'}
          </span>
        </div>
        ${qaHtml}
      </div>
      <div class="card-footer">
        ${completedHtml}
        <span style="color:var(--muted)">QA: ${doneQA}/${sprint.qa.length}</span>
      </div>
    </div>
  `;
}

function render() {
  // Stats
  const total = PROJECT.sprints.length;
  const done = PROJECT.sprints.filter(s => s.status === 'done').length;
  const inprogress = PROJECT.sprints.filter(s => s.status === 'inprogress').length;
  const blocked = PROJECT.sprints.filter(s => s.status === 'blocked').length;
  const todo = total - done - inprogress - blocked;
  const pct = Math.round((done / total) * 100);

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-dot" style="background:var(--accent)"></div><span class="stat-label">Спринтов всего</span><span class="stat-num">${total}</span></div>
    <div class="stat"><div class="stat-dot" style="background:var(--green)"></div><span class="stat-label">Завершено</span><span class="stat-num">${done}</span></div>
    <div class="stat"><div class="stat-dot" style="background:var(--accent2)"></div><span class="stat-label">В работе</span><span class="stat-num">${inprogress}</span></div>
    <div class="stat"><div class="stat-dot" style="background:var(--muted)"></div><span class="stat-label">Ожидают</span><span class="stat-num">${todo}</span></div>
    <div class="stat"><div class="stat-dot" style="background:var(--red)"></div><span class="stat-label">Заблокировано</span><span class="stat-num">${blocked}</span></div>
  `;

  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  // Kanban board
  const board = document.getElementById('kanban-board');
  board.innerHTML = COLUMNS.map(col => {
    const cards = PROJECT.sprints.filter(s => s.status === col);
    return `
      <div class="column">
        <div class="column-header">
          ${COL_TITLES[col]}
          <span class="col-count">${cards.length}</span>
        </div>
        <div class="cards-wrap">
          ${cards.length > 0 ? cards.map(renderCard).join('') : '<div style="text-align:center;color:var(--muted);font-size:12px;padding:20px 0">Пусто</div>'}
        </div>
      </div>
    `;
  }).join('');

  // History
  const timeline = document.getElementById('history-timeline');
  const history = (PROJECT.history || []).sort((a,b) => b.date.localeCompare(a.date));
  if (history.length === 0) {
    timeline.innerHTML = '<div class="history-empty">Ни один спринт ещё не завершён. История появится здесь автоматически.</div>';
  } else {
    timeline.innerHTML = history.map(h => `
      <div class="history-item">
        <div class="history-date">${h.date}</div>
        <div class="history-text"><strong>${h.sprint}</strong> — ${h.text}</div>
      </div>
    `).join('');
  }
}

render();
</script>
</body>
</html>
