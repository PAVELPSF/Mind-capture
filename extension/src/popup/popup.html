<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>MindCapture</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      background: oklch(0.065 0 0);
      color: oklch(0.93 0 0);
      color-scheme: dark;
    }
    button {
      width: 100%;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: oklch(0.52 0.22 264);
      color: oklch(0.985 0 0);
      cursor: pointer;
    }
    button:hover {
      background: oklch(0.56 0.2 264);
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: oklch(0.62 0 0);
      text-align: center;
    }
  </style>
</head>
<body>
  <button id="capture-btn" style="margin-bottom: 8px;">Отправить вкладки в MindCapture</button>
  <button id="import-btn" style="background: oklch(0.45 0.18 145);">Импортировать закладки</button>
  <div id="status"></div>
  <script src="popup.ts"></script>
</body>
</html>
